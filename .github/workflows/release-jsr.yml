name: Publish to JSR

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # JSR authenticates GitHub Actions through OIDC.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Set up Deno for JSR source checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint source and examples
        run: deno lint src examples tests

      - name: Check Deno entry point
        run: deno check src/mod.ts

      - name: Set package version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must contain a valid semantic version: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          jq --arg version "$VERSION" '.version = $version' deno.json > deno.tmp
          mv deno.tmp deno.json
          jq --arg version "$VERSION" '.version = $version' package.json > package.tmp
          mv package.tmp package.json

      - name: Publish package to JSR
        run: npx jsr publish --allow-dirty
